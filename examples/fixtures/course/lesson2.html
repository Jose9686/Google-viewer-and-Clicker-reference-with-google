  <h1>Lesson 2: Inputs and outputs</h1>
  <p>Photosynthesis needs three inputs: carbon dioxide from the air, water from
  the soil, and light energy from the sun. The outputs are glucose, which the
  plant uses as food, and oxygen, which is released into the air.</p>
