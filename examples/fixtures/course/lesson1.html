  <h1>Lesson 1: What is photosynthesis?</h1>
  <p>Photosynthesis is the process by which green plants convert sunlight into
  chemical energy. It takes place mainly in the leaves of plants. The green
  pigment chlorophyll captures light energy from the sun.</p>
